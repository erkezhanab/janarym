; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32 @ 6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_port = /dev/cu.usbserial-*
upload_speed = 115200
board_build.partitions = huge_app.csv
board_build.filesystem = spiffs
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
lib_deps = mobizt/Firebase ESP32 Client@^4.4.17

; Development build: additionally allows "?token=<...>" on /stream and /snapshot
; so the camera can be opened from a browser. Never flash this to a device
; that leaves the bench.
[env:esp32cam-debug]
extends = env:esp32cam
build_flags =
	${env:esp32cam.build_flags}
	-DJANARYM_DEBUG_STREAM_TOKEN_QUERY
